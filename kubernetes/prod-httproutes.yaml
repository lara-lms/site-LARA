# Production routes
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: site-route
  namespace: lara-production
spec:
  parentRefs:
  - name: lara-gateway
    sectionName: https
  hostnames:
  - "site.lara.bonfimalan.com.br"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: lara-site
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cloud-http-redirect-route
  namespace: lara-production
spec:
  parentRefs:
  - name: lara-gateway
    sectionName: http
  hostnames:
  - "site.lara.bonfimalan.com.br"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
      - type: RequestRedirect
        requestRedirect:
          scheme: https
